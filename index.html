<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>三角線 リアルタイム列車運行情報</title>

  <!-- Leaflet Leaflet CSS (地図用) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <!-- カスタムスタイルシート -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ヘッダーエリア -->
  <header class="app-header">
    <div class="header-container">
      <h1>三角線 ナビゲーション</h1>
      <!-- マイ駅ドロップダウン選択 -->
      <div class="my-station-selector">
        <label for="station-select">いつもの駅：</label>
        <select id="station-select">
          <option value="宇土">宇土駅</option>
        </select>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="main-content">
    
    <!-- マイ駅情報タイトル -->
    <section class="station-header-section">
      <span class="badge">MY STATION</span>
      <h2 id="my-station-name-display">宇土駅</h2>
    </section>

    <!-- 接近情報エリア -->
    <section class="approach-section">
      <div id="approach-info-container">
        <p class="loading-text">データを読み込み中...</p>
      </div>
    </section>

    <!-- 時刻表エリア -->
    <section class="timetable-section">
      <div id="timetable-container">
        <p class="loading-text">時刻表を読み込み中...</p>
      </div>
    </section>

    <!-- 地図表示エリア -->
    <section class="map-section">
      <div class="card-title-box">
        <h3>リアルタイム路線マップ</h3>
      </div>
      <div id="map"></div>
    </section>

  </main>

  <!-- External Library JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Application Modules -->
  <script src="mock-data.js"></script>
  <script src="route-geometry.js"></script>
  <script src="app.js"></script>
</body>
</html>
