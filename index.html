<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>三角線 リアルタイム列車運行情報</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="app-header">
    <div class="header-container">
      <h1>三角線 ナビゲーション</h1>
      <div class="my-station-selector">
        <label for="station-select">いつもの駅：</label>
        <select id="station-select">
          <option value="宇土">宇土</option>
          <option value="緑川">緑川</option>
          <option value="住吉">住吉</option>
          <option value="肥後長浜">肥後長浜</option>
          <option value="網田">網田</option>
          <option value="赤瀬">赤瀬</option>
          <option value="石打ダム">石打ダム</option>
          <option value="波多浦">波多浦</option>
          <option value="三角">三角</option>
        </select>
      </div>
    </div>
  </header>

  <main class="main-content">
    
    <section class="station-header-section">
      <span class="badge">MY STATION</span>
      <h2 id="my-station-name-display">宇土駅</h2>
    </section>

    <section class="approach-section">
      <div id="approach-info-container"></div>
    </section>

    <section class="timetable-section">
      <div id="timetable-container"></div>
    </section>

    <section class="map-section">
      <div class="card-title-box">
        <h3>リアルタイム路線マップ</h3>
      </div>
      <div id="map"></div>
    </section>

  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="mock-data.js"></script>
  <script src="route-geometry.js"></script>
  <script src="app.js"></script>
</body>
</html>
