<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>三角線 リアルタイムナビ</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="./styles.css?v=16" />
</head>
<body class="splash-active">
  <div id="splashScreen" class="splash-screen" aria-label="アプリ起動画面">
    <div class="splash-inner">
      <img src="./assets/splash-logo.png" alt="三角線 リアルタイムナビ ロゴ" class="splash-logo" />
      <p class="splash-title">三角線 リアルタイムナビ</p>
      <p class="splash-subtitle">JR三角線の列車位置・地図・時刻表をひとつに。</p>
    </div>
  </div>

  <header class="app-header">
    <div class="brand">
      <span class="jr-logo-crop" aria-hidden="true">
        <img src="./assets/jr-kyushu-logo.png" alt="" />
      </span>
      <div>
        <p class="eyebrow">三角線 / Prototype</p>
        <h1>三角線 リアルタイムナビ</h1>
      </div>
    </div>
  </header>

  <main id="app">
    <div class="pager" id="pager">
      <section class="page page-status" data-page="0">
        <div class="page-content">
          <div class="hero">
            <div class="hero-copy">
              <span class="status-dot normal"></span>
              <span id="serviceStatus">列車運行情報</span>
            </div>
            <p id="serviceMessage">列車位置と時刻表を照合しながら運行状況を表示します。</p>
          </div>

          <div class="section-title">
            <h2>運行中の列車</h2>
            <span id="trainCount"></span>
          </div>
          <div id="trainCards" class="train-cards"></div>
        </div>
      </section>

      <section class="page page-location" data-page="1">
        <div class="page-content">
          <div class="section-title">
            <h2>列車位置</h2>
            <span>横スクロール</span>
          </div>

          <div class="route-scroll">
            <div class="route-stage" id="routeStage">
              <div class="route-line"></div>
              <div id="stationLayer"></div>
              <div id="trainLayer"></div>
            </div>
          </div>

          <div class="legend">
            <span><i class="legend-train outbound"></i> 三角方面</span>
            <span><i class="legend-train inbound"></i> 熊本方面</span>
          </div>

          <section class="train-summary-section" aria-labelledby="trainSummaryHeading">
            <div class="train-summary-heading">
              <h3 id="trainSummaryHeading">路線上の列車運行情報</h3>
              <span>次駅到着予定</span>
            </div>
            <div id="trainSummary" class="train-summary-list"></div>
          </section>
        </div>
      </section>

      <section class="page page-map" data-page="2">
        <div class="page-content">
          <div class="section-title">
            <h2>地図</h2>
            <span>列車位置</span>
          </div>
          <div id="map"></div>
          <p class="note">※ 実運用時は、JR九州から提供される証明書付きデータ取得と、国土数値情報等を用いた線形データへの切替を想定しています。</p>
        </div>
      </section>

      <section class="page page-timetable" data-page="3">
        <div class="page-content">
          <div class="section-title">
            <h2>時刻表</h2>
            <span>駅別表示</span>
          </div>
          <div class="timetable-box">
            <label for="stationSelect">駅を選択</label>
            <select id="stationSelect"></select>
            <div class="direction-tabs">
              <button id="toMisumiBtn" class="direction-btn active">三角方面</button>
              <button id="toKumamotoBtn" class="direction-btn">熊本方面</button>
            </div>
            <div id="timetable"></div>
          </div>
          <p class="note">※ プロトタイプ用の確認データです。正式運用時はJR九州から提供・許諾された時刻表データへ置き換えます。</p>
        </div>
      </section>
    </div>
  </main>

  <nav class="bottom-nav" aria-label="画面切替">
    <button class="nav-btn active" data-target="0" aria-label="運行状況">
      <span class="nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M8 3h8a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3Zm1 4h6M8 11h.01M16 11h.01M8 21l2-3m6 3-2-3"/></svg>
      </span>
      <span class="nav-label">運行状況</span>
    </button>
    <button class="nav-btn" data-target="1" aria-label="列車位置">
      <span class="nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M7 3h10a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3Zm-1 8h12M8 7h8M8 21l2-3m6 3-2-3"/></svg>
      </span>
      <span class="nav-label">列車位置</span>
    </button>
    <button class="nav-btn" data-target="2" aria-label="地図">
      <span class="nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="m3 6 5-2 8 3 5-2v13l-5 2-8-3-5 2V6Zm5-2v13m8-10v13"/></svg>
      </span>
      <span class="nav-label">地図</span>
    </button>
    <button class="nav-btn" data-target="3" aria-label="時刻表">
      <span class="nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      </span>
      <span class="nav-label">時刻表</span>
    </button>
  </nav>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="./mock-data.js?v=16"></script>
  <script src="./app.js?v=16"></script>
</body>
</html>
